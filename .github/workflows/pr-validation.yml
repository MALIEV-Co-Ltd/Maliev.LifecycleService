name: PR Validation

on:
  pull_request:
    branches: [develop, staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_build-and-test.yml
    with:
      solution_file: Maliev.LifecycleService.slnx
    secrets:
      gitops_pat: ${{ secrets.GITOPS_PAT }}

  container:
    name: Build and scan production image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: maliev-lifecycle-service:pr-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build local production image in package mode
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Maliev.LifecycleService.Api/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_TAG }}
          secrets: |
            nuget_username=${{ github.actor }}
            nuget_password=${{ secrets.GITOPS_PAT }}
          cache-from: type=gha,scope=lifecycle-pr-container
          cache-to: type=gha,mode=max,scope=lifecycle-pr-container

      - name: Validate runtime image metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(docker image inspect "$IMAGE_TAG")"
          runtime_uid="$(jq -r '.[0].Config.User' <<< "$metadata")"
          [[ "$runtime_uid" =~ ^[0-9]+$ ]]
          test "$runtime_uid" -gt 0
          test "$(jq -c '.[0].Config.Entrypoint' <<< "$metadata")" = '["dotnet","Maliev.LifecycleService.Api.dll"]'
          test "$(jq -r '.[0].Config.ExposedPorts | has("8080/tcp")' <<< "$metadata")" = "true"
          test "$(jq -r '.[0].Config.Healthcheck == null' <<< "$metadata")" = "true"

      - name: Run production image startup and liveness smoke
        shell: bash
        run: |
          set -euo pipefail
          prefix="lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="${prefix}-network"
          postgres="${prefix}-postgres"
          redis="${prefix}-redis"
          rabbitmq="${prefix}-rabbitmq"
          service="${prefix}-service"
          rabbit_user="health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rabbit_password="$(openssl rand -hex 24)"
          rabbit_auth="$(printf '%s:%s' "$rabbit_user" "$rabbit_password" | base64 --wrap=0)"

          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              for container in "$service" "$postgres" "$redis" "$rabbitmq"; do
                echo "===== $container logs ====="
                docker logs "$container" 2>&1 || true
              done
            fi
            docker rm --force "$service" "$postgres" "$redis" "$rabbitmq" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          wait_for() {
            for _ in $(seq 1 60); do
              if "$@" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          docker network create "$network" >/dev/null
          docker run --detach --name "$postgres" --network "$network" \
            --env POSTGRES_DB=lifecycledb \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            postgres:18-alpine >/dev/null
          docker run --detach --name "$redis" --network "$network" redis:7-alpine >/dev/null
          docker run --detach --name "$rabbitmq" --network "$network" \
            --env HOME=/tmp \
            --env RABBITMQ_MNESIA_BASE=/tmp/rabbitmq/mnesia \
            --env RABBITMQ_DEFAULT_USER="$rabbit_user" \
            --env RABBITMQ_DEFAULT_PASS="$rabbit_password" \
            rabbitmq:4-management-alpine@sha256:0753b75ce99094c385483d89449d532a0544fb85e4942a478b21cc497ab66d33 >/dev/null

          wait_for docker exec "$postgres" pg_isready --host localhost --dbname lifecycledb --username postgres
          wait_for docker exec "$redis" redis-cli ping
          wait_for docker exec "$rabbitmq" wget --quiet --output-document=- \
            --header "Authorization: Basic $rabbit_auth" \
            http://127.0.0.1:15672/api/health/checks/local-alarms

          docker run --detach --name "$service" --network "$network" \
            --publish 127.0.0.1::8080 \
            --env ASPNETCORE_ENVIRONMENT=Testing \
            --env CORS__AllowedOrigins__0=http://localhost \
            --env Features__FailOpenOnIAMError=true \
            --env IAM__RegistrationDelaySeconds=0 \
            --env ConnectionStrings__LifecycleDbContext='Host='"$postgres"';Port=5432;Database=lifecycledb;Username=postgres;Password=postgres' \
            --env ConnectionStrings__redis="$redis:6379" \
            --env ConnectionStrings__rabbitmq="amqp://$rabbit_user:$rabbit_password@$rabbitmq:5672" \
            "$IMAGE_TAG" >/dev/null

          runtime_uid="$(docker image inspect --format '{{.Config.User}}' "$IMAGE_TAG")"
          [[ "$runtime_uid" =~ ^[0-9]+$ ]]
          test "$runtime_uid" -gt 0
          test "$(docker inspect --format '{{.State.Running}}' "$service")" = "true"
          host_port="$(docker port "$service" 8080/tcp | awk -F: '{print $NF}')"
          wait_for curl --fail --silent --show-error "http://127.0.0.1:$host_port/lifecycle/liveness"

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: cyclonedx
          output: trivy-sbom.cdx.json
          scanners: vuln
          exit-code: "0"

      - name: Upload image SBOM evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lifecycle-image-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Scan image for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
